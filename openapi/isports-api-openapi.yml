  /sport/basketball/stats:
    get:
      operationId: getBasketballStats
      summary: Match Stats / Quarters Stats
      description: "**Match Stats**\n\n• This API endpoint returns real-time technical statistics for basketball matches (GMT+0\
        \ 00:00–23:59). \n\nBy default, returns technical statistics for matches within the last 24 hours.\n\n\n\n• Player\
        \ statistics currently supports NBA, WNBA, CBA, Asociación de Clubes de Baloncesto, Basketball Bundesliga, Ligue Nationale\
        \ de Basket, Lega Basket Serie A, Euro, Russian Basketball Super League, NBL(A), and Korea Basketball League.\n\n\n\
        \n• By using endpoints <a href=\"/docs.html?id=48\" style=\"color:blue\">Schedule & Results (Basic)\n</a> and <a href=\"\
        /docs.html?id=34\" style=\"color:blue\">Match Modify Record</a>, you can get basic information of matches.\n\n\n\n\
        • The following offensive statistics can be calculated using formulas.\n\n- Free Throws Percentage (FT%) = Free Throws\
        \ Made / Free Throws Attempts\n\n- 2-Pointers Percentage (2P%) = 2-Pointers Field Goals Made / 2-Pointers Attempts\n\
        \n- 3-Pointers Percentage (3P%) = 3-Pointers Field Goals Made / 3-Pointers Attempts\n\n- Field Goals Percentage (FG%)\
        \ = Field Goals Made / Field Goals Attempts\n\n- Total Rebounds (Reb) = Defensive Rebounds + Offensive Rebounds\n\n\
        **Quarters Stats** (cmd=stats)\n\n• This API endpoint returns single-quarter statistics for basketball matches, limited\
        \ to NBA and similar competitions.\n\n\n\n• The following offensive statistics can be calculated using formulas.\n\
        \n- Free Throws Percentage (FT%) = Free Throws Made / Free Throws Attempts\n\n- 2-Pointers Percentage (2P%) = 2-Pointers\
        \ Field Goals Made / 2-Pointers Attempts\n\n- 3-Pointers Percentage (3P%) = 3-Pointers Field Goals Made / 3-Pointers\
        \ Attempts\n\n- Field Goals Percentage (FG%) = Field Goals Made / Field Goals Attempts\n\n- Total Rebounds (Reb) =\
        \ Defensive Rebounds + Offensive Rebounds"
      tags:
      - Basketball Stats
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
        description: "Match date, format yyyy-MM-dd, e.g. 2026-07-01. \n\n\n\nOnly the past 7 days can be queried."
      - name: matchId
        in: query
        required: false
        schema:
          type: string
        description: Returns match stats for the specified match.
      - name: cmd
        in: query
        required: true
        schema:
          type: string
          enum:
          - stats
        description: "Fixed value stats. \n\n\n\nRequired to distinguish this endpoint from Match Stats, which shares the\
          \ same path."
