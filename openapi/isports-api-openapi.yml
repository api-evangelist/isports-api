      - Football Odds (18 Agencies)
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
        description: "Filter results by date (GMT+0 00:00–23:59). Supports back-checking within the past month. Format: yyyy-MM-dd\
