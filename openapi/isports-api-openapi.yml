      summary: Player Profile / Teamlist with Player Profile
      description: '**Player Profile** (teamId=82)


        • This API endpoint returns comprehensive profile and identity data for football players, supporting records for both
        club and national team associations.




        • Requests require at least one parameter from teamId, day, or playerId (these three parameters are mutually exclusive
        and cannot be used simultaneously).




        • Use it after calling the <a href="https://www.isportsapi.com/en/docs.html?id=246" style="color:blue">Teamlist with
        Player Profile</a> endpoint to obtain valid teamIds, then use those IDs here to retrieve the complete player profiles
        for each squad.




        • It is recommended to perform an initial full data synchronization followed by regular incremental updates, using
        the unique recordId to distinguish between multiple team associations for the same player.


        **Teamlist with Player Profile** (cmd=teamlist)


        • This API endpoint returns a comprehensive list of all team IDs that have associated player profile data in the database.




        • It provides a flat array of unique identifiers representing every team with an active roster.




        • Use it as the primary entry point to obtain valid teamId values, which are required for retrieving detailed squad
        information via the Player Profile endpoint.


        Must add one of the two parameters teamId and playerId.'
      tags:
      - Football Profile
      parameters:
      - name: teamId
        in: query
        required: false
        schema:
          type: string
        description: Get player data for a specified team.　Supports up to 50 IDs.
      - name: playerId
        in: query
        required: false
        schema:
          type: string
        description: Get specified player data.
      - name: day
        in: query
        required: false
        schema:
          type: string
        description: 'Data modification window;


          returns players updated within the last N days.'
      - name: cmd
        in: query
        required: false
        schema:
