  /sport/football/events/corner:
    get:
      operationId: getFootballEventsCorner
      summary: Corner
      description: '• This API endpoint returns real-time corner kick events and statistics for football matches on the current
        day (GMT+0 00:00–23:59).




        • Corner events are identified by eventId and may only be added or deleted (not modified). Always synchronize using
        eventId — if a corner event is corrected, the old eventId will be deleted and a new one added.'
      tags:
      - Football Live Data
      responses:
        '200':
          description: Standard iSports envelope. `code` 0 indicates success; a non-zero `code` carries the error in `message`
            (HTTP status is 200 in both cases).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 on success; 2 on invalid/illegal api_key
                  message:
                    type: string
                    description: '"success" on success; otherwise the error message'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        matchId:
                          type: string
                        homeCorner:
                          type: integer
                          description: Home team total corners (default 0)
                        awayCorner:
                          type: integer
                          description: Away team total corners (default 0)
                        homeHalfCorner:
                          type: integer
                          description: Home team first-half corners (default 0)
                        awayHalfCorner:
                          type: integer
                          description: Away team first-half corners (default 0)
                        eventList:
                          type: array
                          description: List of individual corner kick events for this match
                          items:
                            type: object
                            properties:
                              eventId:
                                type: string
                                description: Unique corner event ID. Events are only added or deleted, never modified
                              teamId:
                                type: string
                                description: ID of the team that won the corner kick
                              minute:
                                type: integer
                                description: "Match minute when the corner was awarded \n\n e.g. 2. Returns 45 for first-half\
                                  \ injury time; 90 for second-half injury time"
                              overtime:
                                type: integer
                                description: "Additional injury time minutes beyond the base minute. Returns 0 when not in\
                                  \ injury time \n\n e.g. a corner at 90+3 returns minute=90, overtime=3"
