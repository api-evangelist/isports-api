  /sport/football/odds/inplay:
    get:
      operationId: getFootballOddsInplay
      summary: In-play Odds
      description: '• This API endpoint returns in-play odds for the main market, covering Asian Handicap (handicap), 1X2
        (europeOdds), and over/under (overUnder).




        • By default, returns in-play odds updated in the past 3 minutes for all matches.




        • The company ID corresponds to the company:


        1: Macauslot, 3: Crown, 4: Ladbrokes ,8: Bet365, 12: Easybets, 14: Vcbet, 17: Mansion88, 19: Interwetten, 22: 10BET,
        24: 12bet, 31: Sbobet, 35: Wewbet, 42: 18bet, 48: HK Jockey Club, 49:BWin, 50:1xbet





        • By using endpoints <a href="/docs.html?id=41" style="color:blue">Schedule & Results (Basic)

        </a> and <a href="/docs.html?id=33" style="color:blue">Match Modify Record</a>, you can get basic information of matches.'
      tags:
      - Football Odds (18 Agencies)
      parameters:
      - name: matchId
        in: query
        required: false
        schema:
          type: string
        description: "Filter results to specific matches. Separate multiple IDs with \",\" (e.g., matchId=322964610,322964611).\
          \ Maximum 100 match IDs per request. \n\n\n\nOnly supports querying matches within the past 20 days."
      - name: companyId
        in: query
        required: false
        schema:
          type: string
        description: Filter results to specific bookmakers. Separate multiple IDs with "," (e.g., companyId=3,8).
      responses:
        '200':
          description: Standard iSports envelope. `code` 0 indicates success; a non-zero `code` carries the error in `message`
            (HTTP status is 200 in both cases).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 on success; 2 on invalid/illegal api_key
                  message:
                    type: string
                    description: '"success" on success; otherwise the error message'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        recordId:
                          type: string
                          description: Unique odds record ID
                        matchId:
                          type: string
                        matchTime:
                          type: integer
                          description: "Match minute at which this odds entry was recorded. \n\n -1: Half-time"
                        homeScore:
                          type: integer
                          description: Live score, home team
                        awayScore:
                          type: integer
                          description: Live score, away team
                        homeRedCount:
                          type: integer
                          description: Deprecated. Always returns 0 — no longer updated.
                        awayRedCount:
                          type: integer
                          description: Deprecated. Always returns 0 — no longer updated.
                        type:
                          type: integer
                          description: "Odds market type \n\n 1: Asian Handicap update (odds1–3: home odds, handicap line,\
                            \ away odds) \n 2: Over/Under update (odds1–3: over odds, line, under odds) \n 3: All markets\
                            \ closed (odds1–3: 0) \n 4: 1X2 update (odds1–3: home win odds, draw odds, away win odds) \n 5:\
                            \ 1X2 closed (odds1–3: 0) \n 6: Asian Handicap closed (odds1–3: 0) \n 7: Over/Under closed (odds1–3:\
                            \ 0)"
                        companyId:
                          type: string
                          description: "1: Macauslot\n3: Crown\n4: Ladbrokes (In-play: Handicap & O/U only)\n8: Bet365\n 12:\
                            \ Easybets\n 14: Vcbet\n 17: Mansion88\n19: Interwetten\n 22: 10BET\n 24: 12bet\n 31: Sbobet\n\
                            35: Wewbet\n42: 18bet\n 48: HK Jockey Club\n 49:BWin(In-play: Handicap & O/U only) \n 50:1xbet"
                        odds1:
                          type: string
                          description: First odds value. Meaning depends on type — see type field above.
                        odds2:
                          type: string
                          description: Second odds value. Meaning depends on type — see type field above.
                        odds3:
                          type: string
                          description: Third odds value. Meaning depends on type — see type field above.
                        changeTime:
                          type: integer
                          description: Timestamp of the last odds update (Unix timestamp, GMT+0)
