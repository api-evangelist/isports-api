        \ including Asian Handicap, 1X2, and over/under — with both full-match and first-half breakdowns.\n\n\n\n• The content\
        \ is consistent with the Pre-match and In-play Odds (Main) endpoint — the entry where handicapIndex = 1 represents\
        \ the main market line.\n\n\n\n• It covers upcoming matches scheduled within the next 14 days (where odds are available)\
        \ and ongoing matches, including both pre-match and in-play (live) odds.\n\n\n\n• Use it alongside the Live Odds Changes\
        \ (All) endpoint for real-time updates, and Schedule & Results or Match Modify Record to get basic match information.\n\
        \n\n\n• Handicap and over/under line format: Lines are multiples of 0.25. \n\n0 = 0 goals, 0.25 = 0/0.5, 0.5 = 0.5,\
        \ 0.75 = 0.5/1, 1 = 1 goal, and so on. A positive value means the home team gives goals; a negative value means the\
        \ away team gives goals.\\\n\n\n\n• The company ID corresponds to the company:\n\n1: Macauslot, 3: Crown, 4: Ladbrokes,\
        \ 7: SNAI, 8: Bet365, 9: William Hill, 12: Easybets, 14: Vcbet, 17: Mansion88, 19: Interwetten, 22: 10BET, 24: 12bet,\
        \ 31: Sbobet, 35: Wewbet, 42: 18bet, 48: HK Jockey Club, 49:Bwin, 50:1xbet\n\n\n\n• Odds format: All odds values are\
        \ returned in Hong Kong Odds format. \n\nTo convert to other formats: Decimal Odds = HK + 1 (e.g., 0.85 → 1.85); Malay\
        \ Odds = HK if HK ≤ 1, or −(1 ÷ HK) if HK > 1 (e.g., 0.85 → 0.85, 1.5 → −0.67); Indonesian Odds = HK if HK ≥ 1, or\
        \ −(1 ÷ HK) if HK < 1 (e.g., 0.85 → −1.18, 1.5 → 1.5); American Odds = HK × 100 if HK ≥ 1, or −(100 ÷ HK) if HK <\
        \ 1 (e.g., 0.85 → −118, 1.5 → +150).\n\n\n\n• close field: Only supported by selected bookmakers: Macauslot (1), Crown\
        \ (3), Bet365 (8), Easybets (12), Mansion88 (17), 10BET (22), 12bet (24), Sbobet (31), Wewbet (35), 18bet (42)."
