                        handicap:
                          type: object
                          description: Asian Handicap odds. Each entry is a comma-separated string containing the fields below.
                          properties:
                            matchId:
                              type: string
                            companyId:
                              type: string
                              description: "1: Macauslot\n 3: Crown\n 4: Ladbrokes\n 7: SNAI\n 8: Bet365\n 9: William Hill\n\
                                \ 12: Easybets\n 14: Vcbet\n 17: Mansion88\n 19: Interwetten\n 22: 10BET\n 24: 12bet\n 31:\
                                \ Sbobet\n 35: Wewbet\n 42: 18bet\n 48: HK Jockey Club"
                            initialHandicap:
