      description: '• This API endpoint returns pre-match and in-play odds for Overtime (Extra Time) and Penalty Shootout
        markets.




        • Currently only supports SB (companyId 3). Company IDs in this endpoint are independent from the IDs used in Odds
        (18 Agencies).




        • Note: The odds returned by this endpoint are net odds (excluding the stake/principal). To calculate the full payout
        odds, add 1 to the value returned (e.g., a value of 3.5 represents a full payout odds of 4.5).'
