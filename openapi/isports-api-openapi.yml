  /sport/football/odds/eurohandicap/prematch:
    get:
      operationId: getFootballOddsEurohandicapPrematch
      summary: EuroHandicap (pre-match)
      description: "• This API endpoint returns pre-match odds for European Handicap (EuroHandicap), which applies a goal\
        \ handicap (typically starting from 1 goal) to one team and offers a 1X2-style market (home win / draw / away win)\
        \ on the adjusted score. This follows the same concept as \"Asian Handicap,\" and is the basis for the \"Handicap\
        \ 1X2\" odds offered by some domestic platforms.\n\n\n\n• Handicap direction: \n\nPositive value = home team gives\
        \ goals (home team favored). \n\nNegative value = home team receives goals, i.e., the away team gives goals (away\
        \ team favored). \n\nThis follows the same convention as Asian Handicap.\n\n\n\n\n• Currently supports Bet365 (8)\
        \ and Interwetten (19).\n\n\n\n• Note: The odds returned by this endpoint are net odds (excluding the stake/principal).\
        \ To calculate the full payout odds, add 1 to the value returned (e.g., a value of 3.5 represents a full payout odds\
        \ of 4.5)."
      tags:
      - Football Other Odds
      parameters:
      - name: matchId
        in: query
        required: false
        schema:
          type: string
        description: "Get the data for the specified match. \n\nWhen multiple matches are acquired at the same time, use \"\
          ,\" to separate the matchId. e.g. matchId=322964610,322964611."
      - name: companyId
        in: query
        required: false
        schema:
          type: string
        description: "Get the data for the specified company. \n\nWhen multiple companies are acquired at the same time, use\
          \ \",\" to separate the companyId. e.g. companyId=8,19."
      responses:
        '200':
          description: Standard iSports envelope. `code` 0 indicates success; a non-zero `code` carries the error in `message`
            (HTTP status is 200 in both cases).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 on success; 2 on invalid/illegal api_key
                  message:
                    type: string
