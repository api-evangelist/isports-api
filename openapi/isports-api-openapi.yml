      - Basketball Live Data
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
        description: "Match date, format yyyy-MM-dd, e.g. 2026-07-01. \n\n\n\nReturns matches scheduled for the specified\
          \ date (GMT+0 00:00–23:59)."
      - name: leagueId
        in: query
        required: false
        schema:
          type: string
        description: "Filter by a specific league or cup ID. \n\n\n\nReturns schedule data for the current season of the specified\
          \ league or cup."
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: "Used together with leagueId to retrieve matches for a specific season, e.g. 25-26. \n\n\n\nReturns the\
          \ current season by default."
      - name: matchId
