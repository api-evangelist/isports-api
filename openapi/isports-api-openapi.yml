  /sport/basketball/odds/european/all:
    get:
      operationId: getBasketballOddsEuropeanAll
      summary: Money Line (80+ bookmakers)
      description: '• This API endpoint returns Money Line odds from nearly 100 international bookmakers, along with basic
        match information (matchId, matchTime, league, and team names) — no need to call Schedule & Results separately for
        this endpoint.




        • Parameter


        -No parameters: returns all odds for today (GMT+0 00:00–23:59).


        -day=n: returns all odds for the next n days from now (maximum 3).


        -date=yyyy-MM-dd: returns all odds for the specified date. Supports querying up to the next 10 days.


        -min=5: returns odds that changed within the last 5 minutes (recommended for tracking updates).




        • Win rate and return rate calculation method:


        - Return rate = (float)Math.Round(1 / (1/home odds + 1/away odds) * 100, 2);


        - Home team win rate = (float)Math.Round((1/home odds) / (1/home odds + 1/away odds) * 100, 2);


        - Away team win rate = (float)Math.Round((1/away odds) / (1/home odds + 1/away odds) * 100, 2);


        (Note: The win rate can also be simply calculated as Return rate / odds)




        • For a visual reference of this data, see: https://www.goaloo.com/basketball/women%E2%80%99s-national-basketball-association-dallas-wings-vs-new-york-liberty/1x2-705113'
      tags:
      - Basketball Odds
      parameters:
      - name: day
        in: query
        required: false
        schema:
          type: string
        description: Returns odds for all matches from today through the specified number of days into the future. Maximum
          3.
      - name: date
        in: query
        required: false
        schema:
          type: string
        description: "Returns odds for all matches on the specified date. Format yyyy-MM-dd. \n\n\n\nSupports querying up\
          \ to the next 10 days."
      - name: min
        in: query
        required: false
        schema:
          type: string
        description: Returns odds that were updated within the specified number of minutes.
      responses:
        '200':
          description: Standard iSports envelope. `code` 0 indicates success; a non-zero `code` carries the error in `message`
            (HTTP status is 200 in both cases).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 on success; 2 on invalid/illegal api_key
                  message:
                    type: string
                    description: '"success" on success; otherwise the error message'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        matchId:
                          type: string
                          description: Unique ID of the match.
                        matchTime:
                          type: integer
                          description: Match scheduled time (Unix timestamp, GMT+0).
                        leagueName:
                          type: string
                          description: Name of the league.
                        homeName:
                          type: string
                          description: Name of the home team.
                        awayName:
                          type: string
                          description: Name of the away team.
                        odds:
