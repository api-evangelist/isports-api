  /sport/basketball/odds/inplay:
    get:
      operationId: getBasketballOddsInplay
      summary: In-play Odds
      description: "• This endpoint returns in-play (live) odds for basketball matches, covering the Handicap and Over/Under\
        \ markets across Full time, Half time, and each individual quarter.\n\n\n\n• By default, returns all odds changes\
        \ recorded within the past 3 minutes. Use matchId to retrieve the full in-play odds history for a specific match,\
        \ and/or companyId to filter to one or more bookmakers (e.g. companyId=3,8).\n\n\n\n• Company ID mapping (shared across\
        \ both Handicap and Over/Under markets — unlike the separate ID sets used in our pregame odds endpoints):\n\n1: Marcauslot；2:\
        \ Easybet；3: Crown；8: Bet365；9：Vcbet；10： William Hill；19：Interwetten；20：Ladbrokes；31: Sbobet ；24: 12bet; 30：China\
        \ Sports Lottery; 49:BWin \n\n\n\n• Not every record carries an odds value. Records with type=4 or type=5 indicate\
        \ that a bookmaker has closed/suspended the Handicap or Over/Under market for that stage of the match — odds1/odds2/odds3\
        \ will always be 0 in this case. See the type field description below for how to interpret each record.\n\n\n\n• This\
        \ endpoint returns in-play data only. For pregame odds, see Pre-match Odds (Halftime) and Pre-match Odds (Quarter)."
      tags:
      - Basketball Odds
      parameters:
      - name: matchId
