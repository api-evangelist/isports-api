  /sport/football/league/stage:
    get:
      operationId: getFootballLeagueStage
      summary: Cup Stage Profile
      description: '• This API endpoint returns the structural data for various competition stages of a cup, including qualifying
        rounds, group stages, and knockout phases.




        • It provides configuration details such as group counts, qualification rules (lineup counts), and stage progression
        order for a specific season.




        • Use it alongside the League & Cup Profile endpoint to manage and display complex multi-stage tournament brackets.'
      tags:
      - Football Profile
      responses:
        '200':
          description: Standard iSports envelope. `code` 0 indicates success; a non-zero `code` carries the error in `message`
            (HTTP status is 200 in both cases).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 on success; 2 on invalid/illegal api_key
                  message:
                    type: string
                    description: '"success" on success; otherwise the error message'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        leagueId:
                          type: string
                        season:
                          type: string
                          description: e.g. 2018
                        stageId:
                          type: string
                        stageName:
                          type: string
                          description: Stage name, e.g. Round 1, Group stage.
                        group:
                          type: boolean
                          description: "Group stage flag; \n\n true: stage is divided into groups\n false: knockout or single\
                            \ division"
                        groupNum:
                          type: string
                          description: Total number of groups in this stage
                        currStage:
                          type: boolean
                          description: "Current stage flag; \n\n true: stage is currently in progress\n false: finished or\
                            \ inactive"
                        stageOrder:
                          type: string
                          description: Display sequence of the stage within the cup
                        lineCount:
                          type: string
                          description: "Number of teams qualifying for the next stage from this stage; \n Empty string if\
                            \ not available."
                        hasTwoLegs:
                          type: boolean
                          description: "Two-legged match flag; \n\n true: consists of home and away legs\n false: single match."
                        groupLineupCount:
                          type: integer
                          description: "Qualifying team count per group; formatted as Group,Count separated by semicolons\
                            \ (e.g., A,1;B,1). \n\n Takes precedence over lineCount if both exist."
      externalDocs:
        description: iSports API documentation
        url: https://www.isportsapi.com/en/docs.html?id=112
      x-documentation:
      - https://www.isportsapi.com/en/docs.html?id=112
