                          description: List of odds records from different bookmakers for this match.
                          items:
                            type: object
                            properties:
                              oddsId:
                                type: string
                                description: Unique ID of this odds record.
                              changeTime:
                                type: integer
                                description: Time this odds record was last updated (Unix timestamp, GMT+0).
                              oddsDetail:
                                type: object
