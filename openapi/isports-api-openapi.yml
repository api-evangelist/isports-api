      summary: Schedule & Results
      description: "• This API endpoint returns schedule and result information for basketball matches from the past two months\
        \ up to future fixtures, filtered by date or leagueId. \n\n\n\n• One of the following parameters is required: date,\
        \ leagueId, or matchId — these three cannot be used together in the same request. The season parameter can only be\
        \ used in combination with leagueId, to retrieve matches for a specific season; if omitted, the current season is\
        \ returned by default.\n\n\n\n• You can use it with the <a href=\"/docs.html?id=34\" style=\"color:blue\">Match Modify\
        \ Record\n</a> \nendpoint to keep locally stored match data in sync."
