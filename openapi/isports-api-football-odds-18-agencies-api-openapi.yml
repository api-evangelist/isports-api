      - Football Odds (18 Agencies)
      parameters:
      - name: matchId
        in: query
        required: false
        schema:
          type: string
        description: "Filter results to specific matches. Separate multiple IDs with \",\" (e.g., matchId=322964610,322964611). Maximum 100 match IDs per request. \n\n\n\nOnly supports querying matches within the past 20 days."
