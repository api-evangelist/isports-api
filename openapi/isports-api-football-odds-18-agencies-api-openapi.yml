  /sport/football/odds/oddsbyid:
    get:
      operationId: getFootballOddsOddsbyid
      summary: Odd Modify Record
      description: "• This API endpoint returns historical odds for matches whose odds changed within a specific time window, supporting three query modes:\n\n\n 1.type=match — Returns a list of matches with historical odds that may have increased or decreased in the last hour, along with the bookmaker that changed and the operation time.\n\n\n\n 2.matchId + companyId — Returns historical odds for a specific match and bookmaker, main market only (e.g., /sport/football/odds/oddsbyid?api_key&matchId=256921227&companyId=3).\n\n\n\n 3.type=multi + matchId + companyId — Returns historical odds for a specific match and bookmaker, all markets (e.g., /sport/football/odds/oddsbyid?api_key&type=multi&matchId=256921227&companyId=3).\n\n\n\n• In-play odds history is available for the past month. Opening and latest pre-match odds are available for up to one year."
      tags:
      - Football Odds (18 Agencies)
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - match
          - multi + matchId + companyId
        description: Returns a list of matches with historical odds that may have changed in the last hour.
      - name: matchId + companyId
        in: query
        required: true
        schema:
          type: string
        description: Returns historical odds for the specified match and bookmaker (main market only).
