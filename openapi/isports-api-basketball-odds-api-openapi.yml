      x-doc-modified: '2026-07-20'
  /sport/basketball/odds/inplay:
    get:
      operationId: getBasketballOddsInplay
      summary: In-play Odds
      description: "• This endpoint returns in-play (live) odds for basketball matches, covering the Handicap and Over/Under markets across Full time, Half time, and each individual quarter.\n\n\n\n• By default, returns all odds changes recorded within the past 3 minutes. Use matchId to retrieve the full in-play odds history for a specific match, and/or companyId to filter to one or more bookmakers (e.g. companyId=3,8).\n\n\n\n• Company ID mapping (shared across both Handicap and Over/Under markets — unlike the separate ID sets used in our pregame odds endpoints):\n\n1: Marcauslot；2: Easybet；3: Crown；8: Bet365；9：Vcbet；10： William Hill；19：Interwetten；20：Ladbrokes；31: Sbobet ；24: 12bet; 30：China Sports Lottery; 49:BWin \n\n\n\n• Not every record carries an odds value. Records with type=4 or type=5 indicate that a bookmaker has closed/suspended the Handicap or Over/Under market for that stage of the match — odds1/odds2/odds3 will always be 0 in this case. See the type field description below for how to interpret each record.\n\n\n\n• This endpoint returns in-play data only. For pregame odds, see Pre-match Odds (Halftime) and Pre-match Odds (Quarter)."
      tags:
      - Basketball Odds
      parameters:
      - name: matchId
        in: query
        required: false
        schema:
          type: string
        description: Returns in-play odds for the specified match only. If omitted, returns odds changes for all matches within the past 3 minutes.
      - name: companyId
        in: query
        required: false
        schema:
          type: string
        description: Filters results to the specified bookmaker(s). Use a comma to separate multiple IDs, e.g. companyId=3,8. If omitted, returns odds from all bookmakers.
      responses:
        '200':
          description: Standard iSports envelope. `code` 0 indicates success; a non-zero `code` carries the error in `message` (HTTP status is 200 in both cases).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 on success; 2 on invalid/illegal api_key
                  message:
                    type: string
                    description: '"success" on success; otherwise the error message'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        recordId:
                          type: string
                          description: Unique ID for this odds record.
                        matchId:
                          type: string
                        matchTime:
                          type: string
                          description: "Match clock at the moment this odds record was captured, formatted as <period> <mm:ss>. \n\n Period is 1st/2nd/3rd/4th (quarter), HT (Half-time), or OT (Overtime); mm:ss is elapsed time within that period."
                        homeScore:
                          type: integer
                          description: Home team score at the time of this odds record.
                        awayScore:
                          type: integer
                          description: Away team score at the time of this odds record.
                        type:
                          type: integer
                          description: "Market type: \n 1=Handicap, \n 2=Over/Under, \n 4=Handicap Closing, \n 5=Over/Under Closing. \n\n 4 and 5 mark that this market has been closed/suspended by the bookmaker — these records do not carry odds values (see odds1/odds2/odds3 below). Determines how to read odds1/odds2/odds3."
                        companyId:
                          type: string
                          description: "1: Macauslot\n 2: Easybets\n 3: Crown\n 8: Bet365\n 9: Vcbet\n 10: William Hill\n 19: Interwetten\n 20: Ladbrokes\n 31: Sbobet\n 24: 12bet\n 30: China Sports Lottery\n 49: BWin"
                        odds1:
                          type: string
                          description: "If type=1: home team odds. \n If type=2: Over odds.\n If type=4 or 5: always 0 — the market is closed, no odds value applies."
                        odds2:
                          type: string
                          description: "If type=1: the handicap line. \n If type=2: the total (points) line. \n If type=4 or 5: always 0."
                        odds3:
                          type: string
                          description: "If type=1: away team odds. \n If type=2: Under odds. \n If type=4 or 5: always 0."
                        oddsType:
                          type: integer
                          description: "Match stage this record belongs to: \n 6=Full time, \n 3=Half time, \n 1=Q1, 2=Q2, 4=Q3, 5=Q4."
                        changeTime:
                          type: integer
                          description: Unix timestamp of when this odds change occurred.
      externalDocs:
        description: iSports API documentation
        url: https://www.isportsapi.com/en/docs.html?id=244
