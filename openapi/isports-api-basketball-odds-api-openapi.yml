                              type: string
                              description: Same as above, for Q3.
                            thirdOver:
                              type: string
                            thirdUnder:
                              type: string
                            fourthHandicap:
                              type: string
                              description: Same as above, for Q4.
                            fourthOver:
                              type: string
                            fourthUnder:
                              type: string
                            initial firstHandicap:
                              type: string
                              description: Opening Q1 total line and odds. Empty if not yet quoted.
                            initial firstOver:
                              type: string
