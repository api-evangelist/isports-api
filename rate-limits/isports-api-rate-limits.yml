description: iSports API publishes a per-endpoint minimum call interval ("This interface is limited to N seconds/call")
  and a recommended polling frequency on every endpoint documentation page. Limits are enforced per API key; the
  free trial adds a separate daily quota of 200 calls per sport. There is no documented rate-limit response header
  — exceeding a limit is surfaced in the JSON envelope message.
enforcement:
  style: minimum interval between calls, per endpoint, per api_key
  response_headers: null
  signal: error message in the {code, message} envelope; HTTP status remains 200
