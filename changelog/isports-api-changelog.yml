- date: '2025-11-21'
  endpoint: Live Data - Stats
  sport: football
  documentation: https://www.isportsapi.com/en/docs.html?id=16
  change: 'Expanded the returned dataset for the type field in the Stats API. New statistic items have been added
    starting from index 47, including multiple popular xG-related metrics. Newly added fields with descriptions:
    47: BigChances – Number of clear goal-scoring opportunities. 48: BigChancesMissed – Number of clear chances
    that were not converted. 49: ShotsInsideBox – Total shots taken from inside the penalty box. 50: ShotsOutsideBox
    – Total shots taken from outside the penalty box. 51: DuelsWon – Number of duels successfully won. 52: ExpectedGoals
    (xG) – Estimated probability of scoring based on shot quality. 53: xGOpenPlay – Expected goals generated from
    open-play situations. 54: xGSetPlay – Expected goals generated from set-piece situations. 55: xGNonPenalty –
    Expected goals excluding penalties. 56: xGOT (Expected Goals On Target) – Expected goals based on shots that
    hit the target. 57: TouchesInOppositionBox – Number of ball touches inside the opponent’s penalty area. 58:
    AccurateCrosses – Number of successfully completed/correct crosses. 59: GroundDuelsWon – Number of ground duels
    won. 60: AerialDuelsWon – Number of aerial duels won. 61: Clearances – Number of defensive clearances made.'
- date: '2025-11-21'
  endpoint: Profile - Player Profile
