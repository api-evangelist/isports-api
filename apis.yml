      schedules, results, events, shooting data, stats, lineups, live text, standings, team and player
      profiles, transfers, language packs, and pre-match, in-play, future and historical odds. GET-only, with a
      published minimum call interval on every endpoint and paired /changes and /modify delta feeds for polling.
